<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 카드</title>
  <style>
    /* 기본 초기화 및 박스 모델 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 1. 화면 정중앙 배치 & 4. 보라색 그라데이션 배경 */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
      color: #2d3748;
      line-height: 1.6;
    }

    /* 1. 흰색 둥근 카드 스타일 */
    .profile-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 28px;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 카드 호버 시 미세한 입체감 효과 */
    .profile-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 26px 48px rgba(0, 0, 0, 0.22), 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    /* 3. 카드 상단 큰 원형 이미지 플레이스홀더(회색 동그라미) */
    .avatar-placeholder {
      width: 124px;
      height: 124px;
      background-color: #e2e8f0;
      border-radius: 50%;
      margin: 0 auto 24px;
      border: 4px solid #f8fafc;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.06), 0 4px 10px rgba(0, 0, 0, 0.06);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 500;
      user-select: none;
    }

    /* 2. 이름 및 5. 마우스 호버 시 색상 변경 효과 */
    .profile-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: #1a202c;
      margin-bottom: 8px;
      display: inline-block;
      cursor: pointer;
      letter-spacing: -0.02em;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    .profile-name:hover {
      color: #764ba2;
      transform: scale(1.03);
    }

    /* 2. 한 줄 소개 */
    .profile-bio {
      font-size: 0.98rem;
      color: #64748b;
      margin-bottom: 28px;
      word-break: keep-all;
    }

    /* 구분선 */
    .divider {
      height: 1px;
      background-color: #f1f5f9;
      margin: 0 auto 24px;
      width: 85%;
    }

    /* 좋아하는 것 섹션 타이틀 */
    .favorites-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    /* 2. 좋아하는 것 3가지 리스트 */
    .favorites-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .favorite-item {
      background-color: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.25s ease, transform 0.25s ease, border-color 0.25s ease;
    }

    .favorite-item:hover {
      background-color: #f3e8ff;
      border-color: #e9d5ff;
      color: #6b21a8;
      transform: translateX(4px);
    }

    .emoji {
      font-size: 1.2rem;
    }

    /* 모바일 화면 대응 */
    @media (max-width: 420px) {
      .profile-card {
        padding: 36px 24px;
      }

      .avatar-placeholder {
        width: 110px;
        height: 110px;
      }

      .profile-name {
        font-size: 1.55rem;
      }
    }
  </style>
</head>
<body>

  <!-- 메인 프로필 카드 컨테이너 -->
  <main class="profile-card">
    <!-- 상단 원형 이미지 플레이스홀더 -->
    <div class="avatar-placeholder" role="img" aria-label="프로필 이미지 자리"></div>

    <!-- 이름 (마우스 오버 시 색상 변경) -->
    <h1 class="profile-name">김재민</h1>

    <!-- 한 줄 소개 -->
    <p class="profile-bio">작은 디테일로 더 나은 경험을 만드는 크리에이터입니다.</p>

    <div class="divider"></div>

    <!-- 좋아하는 것 3가지 -->
    <section aria-labelledby="favorites-heading">
      <h2 id="favorites-heading" class="favorites-title">좋아하는 것</h2>
      <ul class="favorites-list">
        <li class="favorite-item">
          <span class="emoji" aria-hidden="true">☕</span>
          <span>향긋한 핸드드립 커피</span>
        </li>
        <li class="favorite-item">
          <span class="emoji" aria-hidden="true">🎧</span>
          <span>새벽에 듣는 로파이 음악</span>
        </li>
        <li class="favorite-item">
          <span class="emoji" aria-hidden="true">🚶</span>
          <span>노을 질 때 한강 산책하기</span>
        </li>
      </ul>
    </section>
  </main>

</body>
</html>
